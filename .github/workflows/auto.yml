name: Auto Pluto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pluto-playlist-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Brazil playlist
        run: npm run generate

      - name: Generate simplified Vita M3U
        run: node generate-vita.js

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/plutotv_br.m3u8 output/plutotv_br.xml output/plutotv_br_vita.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes to commit."
          else
            git commit -m "Update Pluto TV Brazil playlist"
            git push
          fi
